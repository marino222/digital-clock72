; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Runs the test suite on real hardware -> pio test -e pico
; Slower (needs a Pico attached), but it is the only env that proves the packed
; structs behave on the RP2040's Cortex-M0+, which cannot do unaligned loads.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower ;Important: earl philhower cranks the clock speed to 133 MHz instead of standard 125 MHz, which impacts SPI transmit speeds

monitor_speed = 115200

; src/ holds the host-only frame inspector, which has no business being
; compiled into firmware. Tests are unaffected: pio test never builds src/.
build_src_filter = -<*>

; Runs the same suite on the host in a couple of seconds -> pio test -e native
; protocol.h is plain C++ with no Arduino dependency, so the framing logic can
; be tested without flashing anything. Use this for day-to-day iteration.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Iinclude

