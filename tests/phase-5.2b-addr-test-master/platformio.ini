; Phase 5.2b: disposable test master for slice 1 (auto-addressing).
; Runs on a classic ESP32 dev board, not the final ESP32-S3.
; Uses the real protocol from software/shared, no copy.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

build_flags =
    -I../../software/shared

monitor_speed = 115200
