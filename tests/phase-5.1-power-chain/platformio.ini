; Phase 5.1, section L: power of one node. Runs steps L1-L9, 20 s each.
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower ; 133 MHz system clock, needed for the 66.5 MHz SPI clock

lib_deps =
    lovyan03/LovyanGFX@^1.1.16

build_flags =
    -DLGFX_USE_V1

; Upload over USB (BOOTSEL / picotool)
[env:pico]
upload_protocol = picotool

; Upload over SWD with the debug probe on J4
[env:pico_swd]
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_speed = 1000
