; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Phase 5.1, section G: flashing and debugging the prototype PCB over SWD.
; The probe is a second Pico running the debugprobe firmware, wired to J4
; (SWCLK, SWDIO, GND). Both upload and debug go through OpenOCD + CMSIS-DAP,
; so no BOOTSEL press and no USB connection to the target is needed for flashing.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower ;Important: earl philhower cranks the clock speed to 133 MHz instead of standard 125 MHz, which impacts SPI transmit speeds

upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_speed = 1000 ; kHz, lower it (e.g. 1000) if the wiring to J4 is long or flaky

; Stop at the start of setup() when a debug session starts. -O0 keeps every
; local variable visible and makes stepping follow the source line by line.
debug_init_break = tbreak setup
debug_build_flags = -O0 -g3 -ggdb

monitor_speed = 115200
