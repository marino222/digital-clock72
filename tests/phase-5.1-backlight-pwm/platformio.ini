; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Phase 5.1, section H, steps H5-H7: backlight PWM on the prototype PCB.
; Same display setup as phase 1.1, plus hardware PWM on GPIO21 (BL_PWM).
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower ;Important: earl philhower cranks the clock speed to 133 MHz instead of standard 125 MHz, which impacts SPI transmit speeds

lib_deps =
    lovyan03/LovyanGFX@^1.1.16

build_flags =
    -DLGFX_USE_V1
    -Wl,-u,_printf_float

monitor_speed = 115200

; Upload over USB (BOOTSEL / picotool), as in phase 1.1
[env:pico]
upload_protocol = picotool

; Upload over SWD with the debug probe on J4, as in phase-5.1-swd-debug
[env:pico_swd]
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_speed = 1000
