; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Everything both slaves share. Node addressing is manual in phase 3.2, so each
; board gets its address baked in at build time via MY_NODE_ID -- flash the
; slave0 environment to one Pico and slave1 to the other, and they will pick
; different slots out of the same broadcast.
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower ;Important: earl philhower cranks the clock speed to 133 MHz instead of standard 125 MHz, which impacts SPI transmit speeds

lib_deps =
    lovyan03/LovyanGFX@^1.1.16

build_flags =
    -DLGFX_USE_V1

monitor_speed = 115200

[env:slave0]
build_flags =
    ${env.build_flags}
    -DMY_NODE_ID=0

[env:slave1]
build_flags =
    ${env.build_flags}
    -DMY_NODE_ID=1
