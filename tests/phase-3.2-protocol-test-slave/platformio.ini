; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Everything both slaves share. Node addressing is manual in phase 3.2, so each
; board gets its address baked in at build time via MY_NODE_ID -- flash the
; slave0 environment to one Pico and slave1 to the other, and they will pick
; different slots out of the same broadcast.
[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower ;Important: earl philhower cranks the clock speed to 133 MHz instead of standard 125 MHz, which impacts SPI transmit speeds

lib_deps =
    lovyan03/LovyanGFX@^1.1.16

build_flags =
    -DLGFX_USE_V1

monitor_speed = 115200

; The two node IDs are deliberately NOT 0 and 1. The master phases each node by
; 360/72 = 5 degrees, so nodes 0 and 1 would sit 5 degrees apart and look
; identical on the bench -- you could not tell whether slave 1 was reading its
; own slot or slot 0. Nodes 0 and 36 are half a revolution apart, so a broken
; address shows up instantly as two displays moving in unison.
[env:slave0]
build_flags =
    ${env.build_flags}
    -DMY_NODE_ID=0

[env:slave1]
build_flags =
    ${env.build_flags}
    -DMY_NODE_ID=36
