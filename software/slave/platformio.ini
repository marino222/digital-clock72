; Slave firmware for one node (RP2040 + GC9A01).
; Architecture: README.md. Shared protocol: ../shared (no copy).

; RP2040 settings, used by the pico and pico_swd envs.
; Not a plain [env] section, because native would inherit it too.
[rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower ; runs at 133 MHz instead of 125 MHz, which matters for SPI speed
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
build_flags =
    -DLGFX_USE_V1
    -I../shared
monitor_speed = 115200

; Upload over USB (BOOTSEL / picotool)
[env:pico]
extends = rp2040
upload_protocol = picotool

; Upload over SWD with the debug probe on J4
[env:pico_swd]
extends = rp2040
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
debug_speed = 1000

; Unit tests on the PC -> pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I../shared
